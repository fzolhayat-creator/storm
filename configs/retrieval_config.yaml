# ============================================================
# Defines the centralized retrieval configuration interface.
#
# The current LM Studio runner selects the active retriever
# through the --retriever command-line argument.
# ============================================================

retrieval:

  # Available options:
  #   duckduckgo
  #   google
  #
  # Current customized branch:
  #   duckduckgo
  engine: duckduckgo

# ------------------------------------------------------------
# DuckDuckGo Configuration
# ------------------------------------------------------------

duckduckgo:

  backend: auto

  max_results: 5

  timeout: 10

  safe_search: true

# ------------------------------------------------------------
# Google Configuration
#
# Future replacement for DuckDuckGo retrieval.
#
# ------------------------------------------------------------

google:

  enabled: false

  max_results: 5

  timeout: 10

  api_key: null

  search_engine_id: null

# ------------------------------------------------------------
# Filtering
# ------------------------------------------------------------

filtering:

  remove_duplicates: true

  minimum_content_length: 200
